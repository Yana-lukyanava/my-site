<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 2 — Boolean logic — IT by Yana Lukyanava</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            background-color: #FFF5F7;
            color: #5A4A4D;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.6;
        }

        .nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #FFDEE6;
            padding-bottom: 15px;
        }
        .nav h1 { font-size: 1.2rem; color: #8B5A6B; }
        .nav-links a { text-decoration: none; color: #FF9AA8; font-weight: 600; }
        .nav-links a:hover { text-decoration: underline; }

        .calculator-box {
            background: #FFFFFF;
            border: 1px solid #FFDEE6;
            border-radius: 28px;
            padding: 40px 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(255, 182, 193, 0.25);
        }

        .calculator-box h2 { color: #8B5A6B; margin-bottom: 10px; font-size: 1.8rem; }
        p.subtitle { color: #A88B94; margin-bottom: 25px; }

        .bits-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .bit-input {
            width: 45px;
            height: 55px;
            font-size: 24px;
            font-family: monospace;
            text-align: center;
            border: 2px solid #FFD1DC;
            border-radius: 12px;
            background-color: #FFF5F7;
            color: #5A4A4D;
            transition: all 0.2s ease;
        }

        .bit-input:focus {
            outline: none;
            border-color: #FF9AA8;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 182, 193, 0.3);
        }

        .result-box {
            padding: 20px;
            background-color: #FFF0F4;
            border-radius: 18px;
            border: 1px solid #FFDEE6;
        }

        .result-label { font-size: 1rem; color: #B89AA3; margin-bottom: 10px; }

        .result-value {
            font-size: 3em;
            font-weight: bold;
            color: #FF9AA8;
            font-family: monospace;
            min-height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .error-text {
            font-size: 0.9rem;
            color: #E74C3C;
            height: 20px;
            margin-top: 10px;
            font-weight: 600;
        }

        @media (max-width: 520px) {
            .nav { flex-direction: column; gap: 10px; }
            .calculator-box { padding: 30px 15px; }
            .bits-container { gap: 5px; }
            .bit-input { width: 35px; height: 45px; font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="nav">
        <h1>IT by Yana Lukyanava</h1>
        <div class="nav-links">
            <a href="index.html">← На главную</a>
        </div>
    </div>

    <div class="calculator-box">
        <h2>Boolean logic</h2>
        <p class="subtitle">Семь бит. Индекс — это их четность.</p>
        
        <!-- Убрали ограничение на ввод, теперь можно вводить что угодно -->
        <div class="bits-container" id="bitsContainer">
            <input type="text" class="bit-input" maxlength="1" oninput="handleInput(this, 0)" onkeydown="handleKeyDown(event, this, 0)">
            <input type="text" class="bit-input" maxlength="1" oninput="handleInput(this, 1)" onkeydown="handleKeyDown(event, this, 1)">
            <input type="text" class="bit-input" maxlength="1" oninput="handleInput(this, 2)" onkeydown="handleKeyDown(event, this, 2)">
            <input type="text" class="bit-input" maxlength="1" oninput="handleInput(this, 3)" onkeydown="handleKeyDown(event, this, 3)">
            <input type="text" class="bit-input" maxlength="1" oninput="handleInput(this, 4)" onkeydown="handleKeyDown(event, this, 4)">
            <input type="text" class="bit-input" maxlength="1" oninput="handleInput(this, 5)" onkeydown="handleKeyDown(event, this, 5)">
            <input type="text" class="bit-input" maxlength="1" oninput="handleInput(this, 6)" onkeydown="handleKeyDown(event, this, 6)">
        </div>
        
        <div class="result-box">
            <div class="result-label">Index (Parity Bit)</div>
            <div class="result-value" id="parityResult">-</div>
            <div class="error-text" id="errorMessage"></div>
        </div>
    </div>

    <script>
        window.onload = function() {
            document.querySelector('.bit-input').focus();
        };

        // Теперь мы НЕ удаляем символы, а просто переводим курсор дальше
        function handleInput(inputElement, index) {
            if (inputElement.value !== "" && index < 6) {
                const inputs = document.querySelectorAll('.bit-input');
                inputs[index + 1].focus();
            }
            checkAndCalculate();
        }

        function handleKeyDown(event, inputElement, index) {
            if (event.key === 'Backspace' && inputElement.value === '' && index > 0) {
                const inputs = document.querySelectorAll('.bit-input');
                inputs[index - 1].focus();
                inputs[index - 1].value = '';
                checkAndCalculate();
            }
        }

        function checkAndCalculate() {
            const inputs = document.querySelectorAll('.bit-input');
            let values = [];
            let allFilled = true;
            let hasInvalidChars = false;

            const errorMsg = document.getElementById('errorMessage');
            const resultElement = document.getElementById('parityResult');

            inputs.forEach(input => {
                if (input.value === '') {
                    allFilled = false;
                } else {
                    values.push(input.value);
                    // Проверяем, ввел ли пользователь что-то кроме 0 и 1
                    if (input.value !== '0' && input.value !== '1') {
                        hasInvalidChars = true;
                    }
                }
            });

            // Если ввели не 0 и 1 — выводим ошибку
            if (hasInvalidChars) {
                resultElement.textContent = '-';
                errorMsg.textContent = "Пожалуйста, вводите только 0 или 1 (двоичный код)";
                return;
            }

            errorMsg.textContent = '';

            // Если все 7 бит введены правильно, считаем
            if (allFilled && values.length === 7) {
                let onesCount = 0;
                values.forEach(bit => {
                    if (bit === '1') onesCount++;
                });

                let parityBit = (onesCount % 2 !== 0) ? '1' : '0';
                resultElement.textContent = parityBit;
            } else {
                resultElement.textContent = '-';
            }
        }
    </script>

</body>
</html>
