<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 2 — Boolean logic — IT by Yana Lukyanava</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            background-color: #FFF5F7;
            color: #5A4A4D;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.6;
        }

        /* Навигация сверху */
        .nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #FFDEE6;
            padding-bottom: 15px;
        }
        
        .nav h1 { font-size: 1.2rem; color: #8B5A6B; }
        .nav-links a { 
            margin-left: 15px; 
            text-decoration: none; 
            color: #FF9AA8; 
            font-weight: 600;
        }
        .nav-links a:hover { text-decoration: underline; }

        /* Основное окно */
        .calculator-box {
            background: #FFFFFF;
            border: 1px solid #FFDEE6;
            border-radius: 28px;
            padding: 40px 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(255, 182, 193, 0.25);
        }

        .calculator-box h2 {
            color: #8B5A6B;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .calculator-box p {
            color: #A88B94;
            margin-bottom: 10px;
        }

        input[type="text"] {
            width: 85%;
            padding: 12px 15px;
            font-size: 22px;
            letter-spacing: 5px;
            text-align: center;
            border: 2px solid #FFD1DC;
            border-radius: 30px;
            margin-bottom: 20px;
            margin-top: 10px;
            font-family: monospace;
            outline: none;
            color: #5A4A4D;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #FF9AA8;
        }

        /* Блок с результатом */
        .result-box {
            margin-top: 30px;
            padding: 25px 20px;
            background-color: #FFF0F4;
            border-radius: 18px;
            border: 1px solid #FFDEE6;
        }

        .result-label {
            font-size: 1rem;
            color: #B89AA3;
            margin-bottom: 10px;
        }

        .result-value {
            font-size: 3em;
            font-weight: bold;
            color: #FF9AA8;
            font-family: monospace;
        }

        @media (max-width: 520px) {
            .nav { flex-direction: column; gap: 10px; }
            .calculator-box { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="nav">
        <h1>IT by Yana Lukyanava</h1>
        <div class="nav-links">
            <a href="index.html">← На главную</a>
        </div>
    </div>

    <div class="calculator-box">
        <h2>Boolean logic</h2>
        <p>Семь бит. Индекс — это их четность.</p>
        <p style="font-size: 0.9em; color: #B89AA3;">Введите 7 бит (0 или 1):</p>
        
        <!-- maxlength="7" не дает ввести больше 7 символов -->
        <input type="text" id="bitsInput" maxlength="7" placeholder="1011001" oninput="calculateParity()">
        
        <div class="result-box">
            <div class="result-label">Index (Parity Bit)</div>
            <div class="result-value" id="parityResult">-</div>
        </div>
    </div>

    <script>
        function calculateParity() {
            const input = document.getElementById('bitsInput').value;
            const resultElement = document.getElementById('parityResult');

            // Очищаем ввод от всего, кроме 0 и 1
            const cleanInput = input.replace(/[^01]/g, '');
            document.getElementById('bitsInput').value = cleanInput;

            // Если ввели не 7 символов, ничего не считаем
            if (cleanInput.length !== 7) {
                resultElement.textContent = '-';
                return;
            }

            // Считаем количество единиц
            let onesCount = 0;
            for (let i = 0; i < cleanInput.length; i++) {
                if (cleanInput[i] === '1') {
                    onesCount++;
                }
            }

            // Вычисляем бит четности (Even Parity)
            // Если единиц нечетное количество, добавляем 1, чтобы стало четным
            let parityBit = (onesCount % 2 !== 0) ? '1' : '0';

            // Выводим результат
            resultElement.textContent = parityBit;
        }
    </script>

</body>
</html>
