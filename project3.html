<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 3 — Hamming Code — IT by Yana Lukyanava</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            background-color: #FFF5F7;
            color: #5A4A4D;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.6;
        }

        .nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #FFDEE6;
            padding-bottom: 15px;
        }
        .nav h1 { font-size: 1.2rem; color: #8B5A6B; }
        .nav-links a { text-decoration: none; color: #FF9AA8; font-weight: 600; }
        .nav-links a:hover { text-decoration: underline; }

        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 0 0 5px 0; font-size: 2rem; color: #8B5A6B; }
        .header p { margin: 0; color: #A88B94; font-size: 0.95rem; }

        .diagram-container {
            position: relative;
            width: 500px;
            height: 450px;
            border: 1px solid #FFDEE6;
            border-radius: 20px;
            background-color: #FFFFFF;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.15);
            overflow: hidden;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            border: 2px solid #FF9AA8;
            opacity: 0.3;
            mix-blend-mode: multiply; 
        }

        .circle-red { width: 280px; height: 280px; left: 110px; top: 20px; background-color: #FFC0CB; border-color: #FF9AA8; }
        .circle-blue { width: 280px; height: 280px; left: 30px; top: 140px; background-color: #E6E6FA; border-color: #B4A0D6; }
        .circle-green { width: 280px; height: 280px; left: 190px; top: 140px; background-color: #FADADD; border-color: #F4A460; }

        .bit-input {
            position: absolute;
            width: 38px;
            height: 38px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #FFD1DC;
            border-radius: 8px;
            background: white;
            color: #5A4A4D;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }

        .bit-input:focus {
            outline: none;
            border-color: #FF9AA8;
            box-shadow: 0 0 0 3px rgba(255, 154, 168, 0.3);
        }

        .pos-top { left: 231px; top: 70px; }      
        .pos-left { left: 90px; top: 250px; }     
        .pos-right { left: 372px; top: 250px; }   
        .pos-center { left: 231px; top: 200px; }  
        .pos-c1 { left: 160px; top: 180px; }      
        .pos-c2 { left: 302px; top: 180px; }      
        .pos-c3 { left: 231px; top: 290px; }      

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
            font-family: inherit;
        }

        .btn-test { background-color: #FFB6C1; color: white; }
        .btn-test:hover { background-color: #FF9AA8; }
        
        .btn-clear { background-color: #FFF0F4; color: #8B5A6B; border: 1px solid #FFDEE6; }
        .btn-clear:hover { background-color: #FFDEE6; }

        .btn-back { 
            background-color: #FFF0F4; 
            color: #FF9AA8; 
            text-decoration: none;
            padding: 10px 30px;
            border-radius: 30px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-back:hover { background-color: #FFDEE6; }

        .error-text {
            font-weight: bold;
            font-size: 1.1rem;
            height: 24px; 
        }

        .error-highlight {
            border: 2px solid #E74C3C !important;
            background-color: #FFEBEE !important;
            color: #E74C3C !important;
        }

        @media (max-width: 560px) {
            .diagram-container { transform: scale(0.8); margin-bottom: -40px; }
            .nav { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="nav">
        <h1>IT by Yana Lukyanava</h1>
        <div class="nav-links">
            <a href="index.html">← На главную</a>
        </div>
    </div>

    <div class="header">
        <h2>Project 3</h2>
        <p>Hamming Code</p>
    </div>

    <div class="diagram-container" id="diagram">
        <div class="circle circle-red"></div>
        <div class="circle circle-blue"></div>
        <div class="circle circle-green"></div>

        <input type="text" class="bit-input pos-top" maxlength="1" oninput="filterInput(this)">
        <input type="text" class="bit-input pos-left" maxlength="1" oninput="filterInput(this)">
        <input type="text" class="bit-input pos-right" maxlength="1" oninput="filterInput(this)">
        <input type="text" class="bit-input pos-center" maxlength="1" oninput="filterInput(this)">
        <input type="text" class="bit-input pos-c1" maxlength="1" oninput="filterInput(this)">
        <input type="text" class="bit-input pos-c2" maxlength="1" oninput="filterInput(this)">
        <input type="text" class="bit-input pos-c3" maxlength="1" oninput="filterInput(this)">
    </div>

    <div class="controls">
        <div class="btn-group">
            <button class="btn btn-test" onclick="testHamming()">Проверить (Test)</button>
            <button class="btn btn-clear" onclick="clearAll()">Очистить</button>
        </div>
        <div class="error-text" id="errorMessage"></div>
    </div>

    <a href="index.html" class="btn btn-back">← Вернуться на главную</a>

    <script>
        // Убрали принудительную замену символов, теперь можно вводить что угодно
        function filterInput(input) {
            input.classList.remove('error-highlight');
            document.getElementById('errorMessage').textContent = '';
        }

        function clearAll() {
            const inputs = document.querySelectorAll('.bit-input');
            inputs.forEach(input => {
                input.value = '';
                input.classList.remove('error-highlight');
            });
            document.getElementById('errorMessage').textContent = '';
        }

        function testHamming() {
            const inputs = document.querySelectorAll('.bit-input');
            const errorMsg = document.getElementById('errorMessage');
            
            inputs.forEach(input => input.classList.remove('error-highlight'));
            errorMsg.textContent = '';

            let bits = [];
            let hasInvalidChars = false;

            // Собираем значения и проверяем на наличие запрещенных символов
            Array.from(inputs).forEach(input => {
                if (input.value !== '' && input.value !== '0' && input.value !== '1') {
                    hasInvalidChars = true;
                }
                bits.push(input.value === '1' ? 1 : 0);
            });

            // Если ввели что-то кроме 0 и 1 — ругаемся
            if (hasInvalidChars) {
                errorMsg.style.color = "#E74C3C";
                errorMsg.textContent = "Пожалуйста, вводите только 0 или 1 (двоичный код)";
                return;
            }

            let s1 = (bits[0] + bits[4] + bits[5] + bits[3]) % 2;
            let s2 = (bits[1] + bits[4] + bits[6] + bits[3]) % 2;
            let s3 = (bits[2] + bits[5] + bits[6] + bits[3]) % 2;

            let errors = [];

            if (s1 !== 0) {
                errors.push("s1");
                inputs[0].classList.add('error-highlight');
                inputs[4].classList.add('error-highlight');
                inputs[5].classList.add('error-highlight');
                inputs[3].classList.add('error-highlight');
            }
            if (s2 !== 0) {
                errors.push("s2");
                inputs[1].classList.add('error-highlight');
                inputs[4].classList.add('error-highlight');
                inputs[6].classList.add('error-highlight');
                inputs[3].classList.add('error-highlight');
            }
            if (s3 !== 0) {
                errors.push("s3");
                inputs[2].classList.add('error-highlight');
                inputs[5].classList.add('error-highlight');
                inputs[6].classList.add('error-highlight');
                inputs[3].classList.add('error-highlight');
            }

            if (errors.length === 0) {
                errorMsg.style.color = "#2da44e";
                errorMsg.textContent = "Ошибок нет (No errors)";
            } else {
                errorMsg.style.color = "#E74C3C";
                errorMsg.textContent = "Ошибка в: " + errors.join(", ");
            }
        }
    </script>

</body>
</html>
