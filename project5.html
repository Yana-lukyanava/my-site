<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 5 — WOW/BOW Generator — IT by Yana Lukyanava</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            background-color: #FFF5F7;
            color: #5A4A4D;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.6;
        }

        .nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #FFDEE6;
            padding-bottom: 15px;
        }
        .nav h1 { font-size: 1.2rem; color: #8B5A6B; }
        .nav-links a { text-decoration: none; color: #FF9AA8; font-weight: 600; }
        .nav-links a:hover { text-decoration: underline; }

        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { margin: 0 0 5px 0; font-size: 2.2rem; color: #8B5A6B; }
        .header p { margin: 0; color: #A88B94; font-size: 1rem; }

        .box {
            background: #FFFFFF;
            border: 1px solid #FFDEE6;
            border-radius: 28px;
            padding: 40px 30px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(255, 182, 193, 0.25);
            margin-bottom: 25px;
        }

        /* Картинки */
        .images-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .img-box {
            background: #FFF0F4;
            border: 1px solid #FFDEE6;
            border-radius: 18px;
            padding: 15px;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .img-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Вероятности */
        .probs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #8B5A6B;
            font-size: 1.1rem;
        }

        .stats {
            color: #A88B94;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* Кнопки */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
            font-family: inherit;
        }

        .btn-generate {
            background-color: #FFB6C1;
            color: white;
        }
        .btn-generate:hover { background-color: #FF9AA8; }

        .btn-delete {
            background-color: #FFF0F4;
            color: #8B5A6B;
            border: 1px solid #FFDEE6;
        }
        .btn-delete:hover { background-color: #FFDEE6; }

        .btn-back { 
            background-color: #FFF0F4; 
            color: #FF9AA8; 
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 600;
            transition: background 0.2s;
            display: inline-block;
            margin-top: 10px;
        }
        .btn-back:hover { background-color: #FFDEE6; }

        /* Анимация для выпавшей буквы */
        .big-result {
            font-size: 5rem;
            font-weight: bold;
            color: #FF9AA8;
            height: 80px;
            margin-bottom: 10px;
            transition: transform 0.1s;
        }
        .pop {
            transform: scale(1.2);
        }

        @media (max-width: 520px) {
            .nav { flex-direction: column; gap: 10px; }
            .box { padding: 30px 15px; }
            .images-container { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>

    <div class="nav">
        <h1>IT by Yana Lukyanava</h1>
        <div class="nav-links">
            <a href="index.html">← На главную</a>
        </div>
    </div>

    <div class="header">
        <h2>Project 5</h2>
        <p>WOW/BOW Generator</p>
    </div>

    <div class="box">
        <!-- Картинки с интернета (собачка и буквы) -->
        <div class="images-container">
            <div class="img-box">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Bowser_%28Dog%29.jpg/240px-Bowser_%28Dog%29.jpg" alt="BOW WOW" onerror="this.src='https://cdn-icons-png.flaticon.com/512/616/616408.png'">
            </div>
            <div class="img-box" style="display: flex; flex-direction: column;">
                <div style="font-size: 2.5rem; font-weight: 900; color: #8B5A6B; line-height: 1;">WB</div>
                <div style="font-size: 2.5rem; font-weight: 900; color: #8B5A6B; line-height: 1;">BW</div>
            </div>
        </div>

        <!-- Заданные вероятности -->
        <div class="probs">
            <span>W 50%</span>
            <span>O 37.5%</span>
            <span>B 12.5%</span>
        </div>

        <!-- Вывод текущей статистики -->
        <div class="stats" id="statsDisplay">
            So far: W 0% · O 0% · B 0%
        </div>

        <!-- Результат выпадения -->
        <div class="big-result" id="bigResult"></div>

        <div class="btn-group">
            <button class="btn btn-generate" onclick="generateLetter()">Generate</button>
            <button class="btn btn-delete" onclick="deleteStats()">Delete</button>
        </div>
    </div>

    <a href="index.html" class="btn-back">Back to Home</a>

    <script>
        // Переменные для подсчета статистики
        let countW = 0;
        let countO = 0;
        let countB = 0;

        function generateLetter() {
            // Генерируем случайное число от 0 до 100
            const random = Math.random() * 100;
            let letter = '';

            // Распределяем вероятности: W - 50%, O - 37.5%, B - 12.5%
            if (random < 50) {
                letter = 'W';
                countW++;
            } else if (random < 87.5) { // 50 + 37.5 = 87.5
                letter = 'O';
                countO++;
            } else {
                letter = 'B';
                countB++;
            }

            // Показываем букву
            const resultElement = document.getElementById('bigResult');
            resultElement.textContent = letter;
            
            // Добавляем анимацию
            resultElement.classList.add('pop');
            setTimeout(() => {
                resultElement.classList.remove('pop');
            }, 150);

            // Обновляем статистику
            updateStats();
        }

        function updateStats() {
            const total = countW + countO + countB;
            const statsElement = document.getElementById('statsDisplay');

            if (total === 0) {
                statsElement.textContent = `So far: W 0% · O 0% · B 0%`;
                return;
            }

            // Считаем проценты
            const percentW = ((countW / total) * 100).toFixed(1);
            const percentO = ((countO / total) * 100).toFixed(1);
            const percentB = ((countB / total) * 100).toFixed(1);

            statsElement.textContent = `So far: W ${percentW}% · O ${percentO}% · B ${percentB}%`;
        }

        function deleteStats() {
            // Сбрасываем все счетчики
            countW = 0;
            countO = 0;
            countB = 0;

            // Очищаем экран
            document.getElementById('bigResult').textContent = '';
            updateStats();
        }
    </script>

</body>
</html>
